# L-VPC VMAX Prime Throttle — left hand, the power quadrant.
#
# Axis facts are measured. The HID descriptor is worth more than evdev here: it
# distinguishes a Slider from a Dial, which evdev flattens into ABS_THROTTLE
# and ABS_RUDDER.
#
# Button grouping is captured by hand with capture.py, because it cannot be
# obtained any other way: the firmware reports no HID hat switches at all. An
# earlier attempt to reconstruct it from the DCS captures was cleared after two
# of its guesses turned out wrong.


[device]
slug    = "virpil-vmax-prime-throttle"
product = "L-VPC VMAX Prime Throttle"
vendor  = "VIRPIL"
kind    = "throttle"
hand    = "left"
buttons = 51
axes    = 7

[[identity]]
usb        = "3344:8196"
serial     = "09102A00"
# Contains the firmware build date -- do not match on it.
evdev      = "VIRPIL Controls 20260723 L-VPC VMAX Prime Throttle"
first_seen = "2026-09-12"

[identity.games]
dcs        = "L-VPC VMAX Prime Throttle {4D243B15-AA30-11f1-8004-000044455354}"
warthunder = "3344:8196"

# Survives an identity change, so the same hardware is still
# recognisable after a reconfiguration -- and a change HERE means
# the buttons may have moved, which makes the grouping suspect.
[fingerprint]
buttons = 51
axes    = 7
axmap   = [0, 1, 3, 4, 5, 6, 7]
hid     = ["Rx", "Ry", "Rz", "Slider", "Dial", "Y", "X"]

# --------------------------------------------------------------------- axes

[[axis]]
index  = 0
evdev  = "ABS_X"
hid    = "X"
rest   = "centred"
kind   = "mini-stick-x"
label  = "Thumb mini-stick, horizontal"
suits  = ["view", "cue"]
source = "measured"

[[axis]]
index  = 1
evdev  = "ABS_Y"
hid    = "Y"
rest   = "centred"
travel = "analog"
kind   = "mini-stick-y"
label  = "Thumb mini-stick, vertical"
suits  = ["view", "cue"]
source = "measured"

[[axis]]
index  = 2
evdev  = "ABS_RX"
hid    = "Rx"
rest   = "mid"
travel = "analog"
kind   = "lever"
label  = "Left throttle lever"
suits  = ["throttle", "collective"]
source = "measured"

[[axis]]
index  = 3
evdev  = "ABS_RY"
hid    = "Ry"
rest   = "mid"
travel = "analog"
kind   = "lever"
label  = "Right throttle lever"
suits  = ["throttle", "zoom", "prop-pitch", "sweep"]
source = "measured"

[[axis]]
index  = 4
evdev  = "ABS_RZ"
hid    = "Rz"
rest   = "min"
travel = "analog"
kind   = "lever"
label  = "Side lever"
suits  = ["collective", "cue", "zoom", "sweep", "radiator"]
source = "measured"

[[axis]]
index  = 5
evdev  = "ABS_THROTTLE"
hid    = "Slider"
rest   = "min"
kind   = "slider"
label  = "Slider"
suits  = ["zoom", "brake", "prop-pitch"]
note   = "Resting at minimum makes it safe for an axis where zero means off."
source = "measured"

[[axis]]
index  = 6
evdev  = "ABS_RUDDER"
hid    = "Dial"
rest   = "centred"
kind   = "dial"
label  = "Rotary dial"
suits  = ["trim", "zoom", "prop-pitch", "radiator"]
note   = """HID calls it a Dial, so it is a rotary rather than a lever -- the best home for a trim axis. Unconfirmed whether it is an absolute pot or an endless encoder; an endless one would not suit an absolute axis."""
source = "measured"

# ------------------------------------------------------------------ buttons

[[group]]
kind   = "dial"
buttons= []
push   = 1
axes   = [5]
label  = "Left side dial"
reach  = "needs letting go"
suits  = ["trim", "occasional"]
source = "measured"

