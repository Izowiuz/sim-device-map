# L-VPC VMAX Prime Throttle — left hand, the power quadrant.
#
# Axis facts are measured. The HID descriptor is worth more than evdev here: it
# distinguishes a Slider from a Dial, which evdev flattens into ABS_THROTTLE
# and ABS_RUDDER.
#
# Button grouping is captured by hand with capture.py, because it cannot be
# obtained any other way: the firmware reports no HID hat switches at all. An
# earlier attempt to reconstruct it from the DCS captures was cleared after two
# of its guesses turned out wrong.


[device]
slug    = "virpil-vmax-prime-throttle"
product = "L-VPC VMAX Prime Throttle"
vendor  = "VIRPIL"
kind    = "throttle"
buttons = 51
axes    = 7

[[identity]]
usb        = "3344:8196"
serial     = "09102A00"
# Contains the firmware build date -- do not match on it.
evdev      = "VIRPIL Controls 20260723 L-VPC VMAX Prime Throttle"
first_seen = 2026-09-12

[identity.games]
dcs        = "L-VPC VMAX Prime Throttle {4D243B15-AA30-11f1-8004-000044455354}"
warthunder = "3344:8196"

# Survives an identity change, so the same hardware is still
# recognisable after a reconfiguration -- and a change HERE means
# the buttons may have moved, which makes the grouping suspect.
# How many buttons and axes it has is in [device]: one count,
# one place, so there is nothing to keep in step.
# Two readings, not two halves of one: `axmap` is the
# kernel's, in joystick-axis order, and `hid` the report
# descriptor's, in its own. They are NOT paired -- which
# axis carries which usage is on its [[axis]] entry.
[fingerprint]
axmap   = [0, 1, 3, 4, 5, 6, 7]
hid     = ["Rx", "Ry", "Rz", "Slider", "Dial", "Y", "X"]

# --------------------------------------------------------------------- axes

[[axis]]
index  = 0
evdev  = "ABS_X"
hid    = "X"
rest   = "centred"
role   = "x"

[[axis]]
index  = 1
evdev  = "ABS_Y"
hid    = "Y"
rest   = "centred"
role   = "y"
stepped = false

[[axis]]
index  = 2
evdev  = "ABS_RX"
hid    = "Rx"
rest   = "mid"
stepped = false
moves_with = [3]
coupling = "switchable"

[[axis]]
index  = 3
evdev  = "ABS_RY"
hid    = "Ry"
rest   = "mid"
stepped = false
moves_with = [2]
coupling = "switchable"
note   = """MEASURED 2026-09-17 with probe.py: 52 consecutive pairs, identical values, 0.00s apart every time -- so while the catch is engaged the right lever is spare only in the file. THIS IS A MODE, not a property: the levers uncouple. Splitting them is what makes the per-engine Thrust Left / Thrust Right split in DCS actually do something; joined, both engines get the same number. War Thunder pitch trim went here once and trimmed on every power change."""

[[axis]]
index  = 4
evdev  = "ABS_RZ"
hid    = "Rz"
rest   = "min"
stepped = false

[[axis]]
index  = 5
evdev  = "ABS_THROTTLE"
hid    = "Slider"
rest   = "min"
note   = "Resting at minimum makes it safe for an axis where zero means off."

[[axis]]
index  = 6
evdev  = "ABS_RUDDER"
hid    = "Dial"
rest   = "centred"
note   = """HID calls it a Dial, so it is a rotary rather than a lever -- the best home for a trim axis. Unconfirmed whether it is an absolute pot or an endless encoder; an endless one would not suit an absolute axis."""

# ------------------------------------------------------------------ buttons

[[group]]
kind   = "button"
id     = "pinky-button"
label  = "Pinky button"
hold_ok = false
rapid_ok = false
modifier_ok = false
states = [
    { button = 0 },
]

