# R-VPC Stick WarBRD-D — right hand, the flying stick.
#
# Axis facts are measured: the HID report descriptor names each control and a
# resting-position read separates a self-centring mini-stick from a lever
# parked at its minimum.
#
# Button grouping is captured by hand with capture.py, because it cannot be
# obtained any other way: the firmware reports no HID hat switches at all, so
# nothing -- not the kernel, not any game -- knows that four buttons are one
# hat. An earlier attempt to reconstruct it from how this device is bound in
# DCS was cleared after two of its guesses turned out wrong.


[device]
slug    = "virpil-vpc-stick-warbrd-d"
product = "R-VPC Stick WarBRD-D"
vendor  = "VIRPIL"
kind    = "stick"
hand    = "right"
buttons = 32
axes    = 6

[[identity]]
usb        = "3344:43e8"
serial     = "080E2100"
# Contains the firmware build date -- do not match on it.
evdev      = "VIRPIL Controls 20260723 R-VPC Stick WarBRD-D"
first_seen = "2026-09-12"

[identity.games]
dcs        = "R-VPC Stick WarBRD-D {4D241405-AA30-11f1-8003-000044455354}"
warthunder = "3344:43E8"

# Survives an identity change, so the same hardware is still
# recognisable after a reconfiguration -- and a change HERE means
# the buttons may have moved, which makes the grouping suspect.
[fingerprint]
buttons = 32
axes    = 6
axmap   = [0, 1, 2, 3, 4, 6]
hid     = ["X", "Y", "Ry", "Rx", "Slider", "Z"]

# --------------------------------------------------------------------- axes

[[axis]]
index  = 0
evdev  = "ABS_X"
hid    = "X"
rest   = "centred"
kind   = "stick-x"
label  = "Main stick, left/right"
source = "measured"

[[axis]]
index  = 1
evdev  = "ABS_Y"
hid    = "Y"
rest   = "centred"
kind   = "stick-y"
label  = "Main stick, fore/aft"
source = "measured"
note   = "Wants inverting in every sim: stick back = nose up."

[[axis]]
index  = 2
evdev  = "ABS_Z"
hid    = "Z"
rest   = "centred"
travel = "analog"
kind   = "twist"
label  = "Stick twist"
source = "measured"

[[axis]]
index  = 3
evdev  = "ABS_RX"
hid    = "Rx"
rest   = "centred"
kind   = "mini-stick-x"
label  = "Thumb mini-stick, horizontal"
source = "measured"

[[axis]]
index  = 4
evdev  = "ABS_RY"
hid    = "Ry"
rest   = "centred"
travel = "analog"
kind   = "mini-stick-y"
label  = "Thumb mini-stick, vertical"
source = "measured"

[[axis]]
index  = 5
evdev  = "ABS_THROTTLE"
hid    = "Slider"
rest   = "min"
kind   = "lever"
label  = "Analogue lever on the grip"
source = "measured"

# ------------------------------------------------------------------ buttons

[[group]]
kind   = "latch"
id     = "trigger-initial-lever"
label  = "Trigger initial lever"
source = "measured"
states = [
    { button = 1, latching = true },
    { button = 0, latching = true },
]

[[group]]
kind   = "trigger"
id     = "main-trigger"
cumulative = true
label  = "Main trigger"
source = "measured"
states = [
    { name = "first",  button = 2 },
    { name = "second", button = 3 },
    { name = "third",  button = 4 },
]

[[group]]
kind   = "ministick"
id     = "mini-stick"
axes   = [3, 4]
label  = "Mini-stick"
source = "measured"
states = [
    { name = "push", button = 5, role = "push" },
]

[[group]]
kind   = "button"
id     = "thumb-top-button"
label  = "Thumb top button"
source = "measured"
states = [
    { button = 6 },
]

[[group]]
kind   = "hat4"
id     = "top-thumb-hat"
label  = "Top thumb hat"
source = "measured"
states = [
    { name = "up",    button = 8,  direction = "up" },
    { name = "right", button = 11, direction = "right" },
    { name = "down",  button = 10, direction = "down" },
    { name = "left",  button = 9,  direction = "left" },
    { name = "push",  button = 7,  role = "push" },
]

[[group]]
kind   = "button"
id     = "thumb-bottom-button"
label  = "Thumb bottom button"
source = "measured"
states = [
    { button = 12 },
]

[[group]]
kind   = "hat4"
id     = "bottom-thumb-hat"
label  = "Bottom thumb hat"
source = "measured"
states = [
    { name = "up",    button = 14, direction = "up" },
    { name = "right", button = 17, direction = "right" },
    { name = "down",  button = 16, direction = "down" },
    { name = "left",  button = 15, direction = "left" },
    { name = "push",  button = 13, role = "push" },
]

[[group]]
kind   = "encoder"
id     = "stick-encoder-and-click"
label  = "Stick encoder and click"
source = "measured"
states = [
    { name = "ccw",  button = 21, direction = "ccw" },
    { name = "cw",   button = 20, direction = "cw" },
    { name = "push", button = 18, role = "push" },
]

[[group]]
kind   = "unwired"
id     = "reported-by-the-firmware-nothing-attached"
label  = "Reported by the firmware, nothing attached"
source = "measured"
states = [
    { button = 19 },
    { button = 27 },
    { button = 28 },
    { button = 29 },
]

[[group]]
kind   = "hat4"
id     = "grip-thumb-hat"
label  = "Grip thumb hat"
source = "measured"
states = [
    { name = "up",    button = 23, direction = "up" },
    { name = "right", button = 26, direction = "right" },
    { name = "down",  button = 25, direction = "down" },
    { name = "left",  button = 24, direction = "left" },
    { name = "push",  button = 22, role = "push" },
]

[[group]]
kind   = "button"
id     = "grip-pinky-button"
label  = "Grip pinky button"
source = "measured"
states = [
    { button = 30 },
]

[[group]]
kind   = "lever"
id     = "analogue-brake-lever-on-the-grip"
axes   = [5]
label  = "Analogue brake lever on the grip"
source = "measured"
states = [
    { name = "travel", button = 31, role = "travel", latching = true },
]
