# R-VPC Stick WarBRD-D — right hand, the flying stick.
#
# Axis facts are measured: the HID report descriptor names each control and a
# resting-position read separates a self-centring mini-stick from a lever
# parked at its minimum.
#
# Button grouping is captured by hand with capture.py, because it cannot be
# obtained any other way: the firmware reports no HID hat switches at all, so
# nothing -- not the kernel, not any game -- knows that four buttons are one
# hat. An earlier attempt to reconstruct it from how this device is bound in
# DCS was cleared after two of its guesses turned out wrong.


[device]
slug    = "virpil-vpc-stick-warbrd-d"
product = "R-VPC Stick WarBRD-D"
vendor  = "VIRPIL"
kind    = "stick"
hand    = "right"
buttons = 32
axes    = 6

[[identity]]
usb        = "3344:43e8"
serial     = "080E2100"
# Contains the firmware build date -- do not match on it.
evdev      = "VIRPIL Controls 20260723 R-VPC Stick WarBRD-D"
first_seen = "2026-09-12"

[identity.games]
dcs        = "R-VPC Stick WarBRD-D {4D241405-AA30-11f1-8003-000044455354}"
warthunder = "3344:43E8"

# Survives an identity change, so the same hardware is still
# recognisable after a reconfiguration -- and a change HERE means
# the buttons may have moved, which makes the grouping suspect.
[fingerprint]
buttons = 32
axes    = 6
axmap   = [0, 1, 2, 3, 4, 6]
hid     = ["X", "Y", "Ry", "Rx", "Slider", "Z"]

# --------------------------------------------------------------------- axes

[[axis]]
index  = 0
evdev  = "ABS_X"
hid    = "X"
rest   = "centred"
kind   = "stick-x"
label  = "Main stick, left/right"
suits  = ["flight-roll"]
source = "measured"

[[axis]]
index  = 1
evdev  = "ABS_Y"
hid    = "Y"
rest   = "centred"
kind   = "stick-y"
label  = "Main stick, fore/aft"
suits  = ["flight-pitch"]
note   = "Wants inverting in every sim: stick back = nose up."
source = "measured"

[[axis]]
index  = 2
evdev  = "ABS_Z"
hid    = "Z"
rest   = "centred"
travel = "analog"
kind   = "twist"
label  = "Stick twist"
suits  = ["flight-yaw"]
source = "measured"

[[axis]]
index  = 3
evdev  = "ABS_RX"
hid    = "Rx"
rest   = "centred"
kind   = "mini-stick-x"
label  = "Thumb mini-stick, horizontal"
suits  = ["view", "cue", "aim"]
source = "measured"

[[axis]]
index  = 4
evdev  = "ABS_RY"
hid    = "Ry"
rest   = "centred"
travel = "analog"
kind   = "mini-stick-y"
label  = "Thumb mini-stick, vertical"
suits  = ["cue", "aim", "view"]
source = "measured"

[[axis]]
index  = 5
evdev  = "ABS_THROTTLE"
hid    = "Slider"
rest   = "min"
kind   = "lever"
label  = "Analogue lever on the grip"
suits  = ["brake"]
source = "measured"

# ------------------------------------------------------------------ buttons

[[group]]
kind   = "ministick"
buttons= []
push   = 5
axes   = [3, 4]
label  = "Mini-stick"
reach  = "thumb, without releasing grip"
suits  = ["view"]
source = "measured"

[[group]]
kind   = "latch"
buttons= [1, 0]
label  = "Trigger initial lever"
reach  = "index finger, on the grip"
suits  = ["state"]
source = "measured"

[[group]]
kind   = "trigger"
buttons= [2, 3, 4]
stages = ["first", "second", "third"]
cumulative= true
label  = "Main trigger"
reach  = "index finger, on the grip"
suits  = ["fire", "fire-escalating"]
source = "measured"

[[group]]
kind   = "button"
buttons= [6]
label  = "Thumb top button"
reach  = "thumb, without releasing grip"
suits  = ["reflex", "fire"]
source = "measured"

[[group]]
kind   = "hat4"
buttons= [8, 11, 10, 9]
dirs   = ["up", "right", "down", "left"]
push   = 7
label  = "Top thumb hat"
reach  = "thumb, without releasing grip"
suits  = ["reflex", "lock", "sensor", "view", "trim"]
source = "measured"

[[group]]
kind   = "button"
buttons= [12]
label  = "Thumb bottom button"
reach  = "thumb, without releasing grip"
suits  = ["reflex", "fire"]
source = "measured"

[[group]]
kind   = "hat4"
buttons= [14, 17, 16, 15]
dirs   = ["up", "right", "down", "left"]
push   = 13
label  = "Bottom thumb hat"
reach  = "thumb, without releasing grip"
suits  = ["reflex", "lock", "sensor", "view", "trim"]
source = "measured"

[[group]]
kind   = "unwired"
buttons= [19, 27, 28, 29]
label  = "Reported by the firmware, nothing attached"
source = "measured"

[[group]]
kind   = "encoder"
buttons= [21, 20]
dirs   = ["ccw", "cw"]
push   = 18
label  = "Stick encoder and click"
reach  = "thumb, without releasing grip"
suits  = ["trim"]
source = "measured"

[[group]]
kind   = "hat4"
buttons= [23, 26, 25, 24]
dirs   = ["up", "right", "down", "left"]
push   = 22
label  = "Grip thumb hat"
reach  = "thumb, without releasing grip"
suits  = ["reflex", "sensor", "view", "trim"]
source = "measured"

[[group]]
kind   = "button"
buttons= [30]
label  = "Grip pinky button"
reach  = "needs letting go"
suits  = ["occasional"]
source = "measured"

[[group]]
kind   = "paddle"
buttons= [31]
label  = "Paddle button"
reach  = "pinky finger, without releasing grip"
suits  = ["reflex"]
source = "measured"
