# What the wizard asks, and in what order.
#
# The order and the branching used to live in one 215-line function of nested
# `if kind ==`, with a second, parallel copy of the same menus for editing.
# Here each question is an entry, and the engine in `questions.py` walks them.
#
# `only` names a predicate in that module's `ONLY` table. It is a name, never
# an expression in a string: a rule written as text in a data file is a rule
# nothing can check until it runs.
#
# `of` is what a question is asked ABOUT, and it decides the shape of the
# screen rather than just its contents:
#
#   control   one control at a time, each answer a box you can step back into.
#             This is how you learn what a thing IS: by pressing it.
#   device    a round over the whole device -- "press everything you can
#             reach from here". Reach is not a fact about one control, so
#             asking control by control would be asking the same question
#             thirty-nine times.
#   all       one list down every control at once. These are comparative
#             judgements: "more distinct than that one", "harder to hold than
#             that one". Spread over thirty-nine screens they come out
#             inconsistent; side by side they calibrate each other.
#
# `how` is the widget: pick one, tick several, type a name, press a button,
# watch a gesture, put directions in order, or walk a round.


# --------------------------------------------------------------- one control

[[ask]]
id     = "buttons"
called = "button IDs"
of     = "control"
how    = "collect"
skip   = true
says = "Press every part of ONE control, then RETURN."
sets = "buttons"
note = """Take one control at a time, and all of it. A hat is one control, so
press all four of its directions and its click as well.

A switch or a lever can stay put. Leave it in the position you mean.
Then press RETURN with it still there.

Nothing to press is an answer. A stick or a lever is an axis with no
buttons at all. A later question asks what it owns instead."""

[[ask]]
id   = "kind"
of   = "control"
how  = "pick"
says = "What is it?"
sets = "kind"
uses = "kind"
note = "The shape decides what else is worth asking."

[[ask]]
id   = "which_way"
of   = "control"
how  = "pick"
only = "asks_which_way"
says = "Which way does it move?"
sets = "dirs"
uses = "axis"

[[ask]]
id   = "sweep"
of   = "control"
how  = "watch"
only = "is_selector"
says = "Start at one end, sweep to the other."
sets = "states"
note = """The position you start on never sends a press. Its contact is already
closed, and it shows itself when it opens. That is why it comes first."""

[[ask]]
id   = "pull"
of   = "control"
how  = "watch"
only = "is_trigger"
says = "Pull it all the way and let go."
sets = "states"
note = """Stages that nest are cumulative. A pull through one stage fires
everything bound up to it."""

[[ask]]
id   = "returns"
of   = "control"
how  = "pick"
only = "found_rest_contact"
says = "Does it come back on its own when you let go?"
uses = "yes_no"
sets = "rest_returns"
note = """Timing cannot tell a trigger's own rest contact from a separate
latching lever you pushed back by hand. Both read the same."""

[[ask]]
id   = "click"
of   = "control"
how  = "press"
only = "can_click"
says = "Does it also click? Press the click in."
sets = "push"
skip = true

[[ask]]
id   = "order"
of   = "control"
how  = "sort"
only = "has_directions"
says = "Press each direction in turn."
sets = "states"
note = """A direction is physical, from your seat. UP is away from you, toward
the nose."""

[[ask]]
id    = "which_axes"
of    = "control"
how   = "sweep"
only  = "owns_axes"
says  = "Move each of its axes."
sets  = "axes"
note  = """Move one axis at a time, end to end. Then let go and wait for it to
settle.

A shape that usually has three axes does not have to have three. A
stick with no twist is still a stick. Back out of one, and the next
question asks whether it is missing."""

[[ask]]
id    = "silent"
of    = "control"
how   = "slot"
only  = "may_sit_silent"
says  = "Is there a position that sends nothing?"
sets  = "silent_at"
skip  = true
note  = """A switch can have a detent that the game never hears about. The
centre of an ON-OFF-(ON) is one. So is a park position with no wire.

Nothing can measure this. A position that sends nothing looks exactly
like a position that is not there."""

[[ask]]
id   = "name"
of   = "control"
how  = "name"
says = "Name it."
sets = "label"
note = "Give it the name you use when you look at the device."


# ----------------------------------------------------------- the whole device

[[ask]]
id    = "reach"
of    = "device"
how   = "rounds"
says  = "Press or move everything you can reach from here."
sets  = "access"
uses  = "level"
# No count in here and none generated for the screen either. A number of
# passes is a fact about the vocabulary above, and one written into a
# sentence goes stale the day a finger or a grip is added.
note  = """This measures how far each control is from your finger.

Use one finger at a time. Press everything that finger reaches from
that grip."""


# ------------------------------------------------- every control, side by side

[[ask]]
id     = "hold_ok"
called = "comfortable to hold"
of     = "all"
how    = "tick"
says   = "Can you hold it down comfortably?"
sets   = "hold_ok"

[[ask]]
id     = "rapid_ok"
called = "quick to click"
of     = "all"
how    = "tick"
says   = "Can you click it repeatedly?"
sets   = "rapid_ok"

[[ask]]
id     = "modifier_ok"
called = "usable as a shift"
of     = "all"
how    = "tick"
says   = "Can you use it as a shift?"
sets   = "modifier_ok"
note   = """A shift layer is a button you hold to give every other button a
second meaning."""

[[ask]]
id     = "blind_distinct"
called = "found without looking"
of     = "all"
how    = "pick"
says   = "Can you find it without looking?"
sets   = "blind_distinct"
uses   = "yes_somewhat_no"
note   = """Put your hand on the device and try it. Does your finger land on this
one? Or do you have to count buttons to find it?"""

[[ask]]
id     = "accident_risk"
called = "hit by mistake"
of     = "all"
how    = "pick"
says   = "Can it be pressed by mistake?"
sets   = "accident_risk"
uses   = "yes_somewhat_no"
note   = """Could you catch it with a knuckle on the way to something else,
or press it instead of its neighbour in a hurry?"""


# ------------------------------------------------------------- what is on offer
#
# The vocabularies the questions above draw from. `dirs` is what a shape's
# positions are called once they are in order; a shape with none has
# positions that point nowhere, like a trigger's detents.

[[vocabulary.kind]]
name = "button"
says = "single button"
hint = ["It has one position and a spring."]

[[vocabulary.kind]]
name = "paddle"
says = "paddle / pinky lever"
hint = ["It sits under a finger. You do not regrip."]

[[vocabulary.kind]]
name = "hat2"
says = "two-way hat or rocker (springs back)"
# Two positions that point somewhere, and nothing about the shape says
# where: a rocker can be any of three pairs.
asks_way = true
hint = ["It has two positions. A spring returns it to a centre that sends nothing."]

[[vocabulary.kind]]
name = "hat4"
says = "four-way hat"
dirs = ["up", "right", "down", "left"]
hint = ["It has four positions under one finger."]

[[vocabulary.kind]]
name = "hat8"
says = "eight-way hat"
dirs = ["up", "right", "down", "left"]
hint = ["It has four positions and the diagonals between them.",
        "A diagonal is two contacts at once, not a ninth position."]

[[vocabulary.kind]]
name = "trigger"
says = "multi-stage trigger"
hint = ["One squeeze goes through two or three detents that nest."]

[[vocabulary.kind]]
name = "switch2"
says = "two-position switch (stays put)"
hint = ["It flips and it stays, so a contact stays held."]

[[vocabulary.kind]]
name = "switch3"
says = "three-position switch"
hint = ["Three detents. The centre may send nothing."]

[[vocabulary.kind]]
name = "latch"
says = "latching lever or flap"
hint = ["It has two positions. It stays where you put it.",
        "The game sees the button HELD, not pressed."]

[[vocabulary.kind]]
name = "selector"
says = "rotary selector (3+ positions)"
hint = ["Each position holds one contact. Only one is closed at a time."]

[[vocabulary.kind]]
name = "encoder"
says = "rotary encoder (detents)"
dirs = ["ccw", "cw"]
hint = ["It clicks round. It does not sweep."]

[[vocabulary.kind]]
name = "dial"
says = "dial / thumbwheel"
axes = ["round"]
hint = ["It turns smoothly. It reports an axis rather than detented buttons.",
        "It often presses in as well."]

[[vocabulary.kind]]
name = "ministick"
says = "mini-stick"
axes = ["horizontal", "vertical"]
hint = ["It centres itself. It has two axes, and often a press.",
        "This is one control, so the click stays with its axes."]

[[vocabulary.kind]]
name = "stick"
says = "main stick"
axes = ["left/right", "fore/aft", "twist"]
hint = ["This is the one you fly with. It has three axes and nothing to press.",
        "A stick with no twist is still a stick. You can skip that axis."]

[[vocabulary.kind]]
name = "lever"
says = "lever"
axes = ["end to end"]
hint = ["It stays where you leave it. A throttle and a collective are levers.",
        "It sometimes has a contact at the end of its travel."]

[[vocabulary.kind]]
name = "slider"
says = "slider"
axes = ["end to end"]
hint = ["It rests at its minimum, so zero means off."]

[[vocabulary.kind]]
name = "pedal"
says = "pedal"
axes = ["travel"]
hint = ["A rudder and a toe brake are pedals."]

[[vocabulary.kind]]
name = "wheel"
says = "wheel"
axes = ["left/right"]
hint = ["This is a steering wheel."]

[[vocabulary.kind]]
name = "axis"
says = "an axis, nothing more said"
axes = ["end to end"]
hint = ["It reports an axis and nobody has said what it is."]

[[vocabulary.axis]]
name = "up_down"
says = "up and down"
dirs = ["up", "down"]

[[vocabulary.axis]]
name = "left_right"
says = "left and right"
dirs = ["left", "right"]

[[vocabulary.axis]]
name = "fwd_aft"
says = "forward and back"
dirs = ["fwd", "aft"]

# Worded to read in a sentence -- "Reach: thumb, in the normal grip" --
# because that is where they are used. The names are for the file.

[[vocabulary.level]]
name = "HOME"
says = "in the normal grip"
hint = ["This is your normal grip. Nothing moves: you do not stretch, and you do not shift your hand."]

[[vocabulary.level]]
name = "EXTENDED"
says = "by stretching"
hint = ["Your hand stays in the grip. Only the finger stretches."]

[[vocabulary.level]]
name = "BASE"
says = "with your hand off the grip"
hint = ["You let go of the grip, but your hand stays on the device."]

# Not a posture you walk a round in -- it is where a control ends up when no
# round reached it, written by the tool once every finger is done. It is here
# because the order of this table IS the tier, and `devicemap.LEVELS` has to
# match it exactly; leaving it out put the fourth level in one table and its
# words in neither.
[[vocabulary.level]]
name = "OFF"
says = "with your hand off the device"
walked = false
hint = ["Nothing on the device reaches it. You take your hand away."]

# A scale, so it is stored as its number and never as its word. `value` is
# what goes in the file and what anything ordering these compares; `says` is
# only what the screen prints. One table, because "can you find it" and "can
# it be pressed by mistake" take the same three answers, and two copies of
# three words is two copies that drift.
#
# The affirmative first, because that is the order pressing a control walks
# them in -- and a yes/no question answers `yes` on the first press. Listed
# the other way round, two of the five ran backwards against the other
# three. The order here is what the screen offers; `value` is what sorts.

[[vocabulary.yes_somewhat_no]]
value = 2
says = "yes"

[[vocabulary.yes_somewhat_no]]
value = 1
says = "somewhat"

[[vocabulary.yes_somewhat_no]]
value = 0
says = "no"

[[vocabulary.yes_no]]
name = "yes"
says = "yes"

[[vocabulary.yes_no]]
name = "no"
says = "no"
