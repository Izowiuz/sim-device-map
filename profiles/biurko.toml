# The desk: which captured devices are on it, and how they sit.
#
# A capture says what a control IS. This says where it ended up, which is a
# fact about the desk rather than about the hardware -- the same throttle on
# a chair rail has a different reach and can be under a different hand. That
# is why `reach` could not stay in the capture file, and why `hand` sat there
# doing nothing until there was somewhere better to put it.
#
# `access` is a list because most controls can be reached more than one way,
# and the nearest way is the one that decides how far a control is. The
# wizard writes it, finger by finger; until it has, a device has none and
# every control on it is of unknown reach.

name = "IzoDesk"

[[device]]
slug = "virpil-vmax-prime-throttle"
role = "throttle"
hand = "left"

[[device]]
slug = "virpil-vpc-stick-warbrd-d"
role = "stick"
hand = "right"
leaving_home_releases_flight = true
rounds = [
    ["HOME", "thumb"],
    ["HOME", "index"],
    ["HOME", "middle"],
    ["HOME", "ring"],
    ["HOME", "pinky"],
    ["EXTENDED", "ring"],
]

[device.access]
analogue-brake-lever-on-the-grip = [
    { part = "stick", level = "HOME", finger = "middle" },
    { part = "stick", level = "HOME", finger = "ring" },
    { part = "stick", level = "HOME", finger = "pinky" },
]
bottom-thumb-hat                 = [{ part = "stick", level = "HOME", finger = "thumb" }]
grip-pinky-button                = [{ part = "stick", level = "EXTENDED", finger = "ring" }]
grip-thumb-hat                   = [{ part = "stick", level = "HOME", finger = "thumb" }]
main-trigger                     = [{ part = "stick", level = "HOME", finger = "index" }]
mini-stick                       = [
    { part = "stick", level = "HOME", finger = "index" },
    { part = "stick", level = "HOME", finger = "thumb" },
]
stick-encoder-and-click          = [{ part = "stick", level = "HOME", finger = "thumb" }]
thumb-bottom-button              = [{ part = "stick", level = "HOME", finger = "thumb" }]
thumb-top-button                 = [{ part = "stick", level = "HOME", finger = "thumb" }]
top-thumb-hat                    = [{ part = "stick", level = "HOME", finger = "thumb" }]
trigger-initial-lever            = [{ part = "stick", level = "HOME", finger = "index" }]
